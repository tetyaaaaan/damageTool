name = "damage-tool"
main = "worker.js"
compatibility_date = "2025-01-01"
workers_dev = false
routes = [
  { pattern = "tetinet.com/*", zone_name = "tetinet.com" }
]

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true

# Refuse dirty/local deployments; retain the existing static-shell build.
[build]
command = "node scripts/prepareWorkerRelease.cjs --check-release && node scripts/syncSiteChrome.cjs && node scripts/prepareWorkerRelease.cjs --check-release"
