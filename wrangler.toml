name = "damage-tool"
main = "worker.js"
compatibility_date = "2025-01-01"
workers_dev = false
routes = [
  { pattern = "tetinet.com/*", zone_name = "tetinet.com" }
]

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true

# Keep committed static shells synchronized before deployment.
[build]
command = "node scripts/syncSiteChrome.cjs"
